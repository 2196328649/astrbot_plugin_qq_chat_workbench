name: astrbot_plugin_super_admin
display_name: QQ 聊天工作台
author: LiuXiangdong
short_desc: 在 AstrBot 面板查看 QQ 群聊与私聊，手动回复或审核 AI 生成的回复。
desc: 浏览群聊、好友与群临时会话，按消息查看日志，手动回复或撤回，引导 AI 在原会话中生成回复并在发送前确认。可按需保存收到的图片到本机。仅供有权管理该机器人的管理员使用。
version: 0.2.11
repo: https://github.com/2196328649/astrbot_plugin_super_admin
astrbot_version: ">=4.29.1,<=4.29.4"
support_platforms:
  - aiocqhttp
tags:
  - QQ
  - 聊天管理
  - OneBot
